[project]
name = "devopspilot"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend", "mcp_server", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
